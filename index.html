<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Michael Cam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  /* Escritorio oscuro; la cámara flota en una esquina y las fotos saltan como ventanas */
  :root {
    --bg: #0d0b14;
    --panel: #1a1626;
    --line: #2e2840;
    --fg: #ece8f4;
    --muted: #9a92ad;
    --accent: #ffd23f;   /* guante brillante */
    --hit: #3ddc84;      /* caja de detección */
    --display: "Bungee", Impact, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 var(--mono);
    overflow: hidden;
  }

  #intro {
    position: fixed; inset: 0; z-index: 5;
    display: grid; place-items: center;
    padding: 24px max(16px, env(safe-area-inset-left, 0px));
    background: radial-gradient(circle at 50% 35%, #241d36 0%, var(--bg) 70%);
  }
  #intro .box { max-width: 34rem; display: grid; gap: 20px; text-align: center; }
  h1 {
    font: 400 clamp(2.4rem, 8vw, 4.5rem)/1 var(--display);
    margin: 0; color: var(--accent);
    text-wrap: balance;
    text-shadow: 0 0 24px rgba(255, 210, 63, .35);
  }
  #intro p { margin: 0; color: var(--muted); }
  #intro p strong { color: var(--fg); font-weight: 600; }
  button {
    font: 600 1rem var(--mono);
    padding: 14px 26px;
    border: 2px solid var(--accent);
    background: var(--accent); color: #1a1405;
    border-radius: 999px; cursor: pointer;
    justify-self: center;
  }
  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  button:disabled { opacity: .6; cursor: progress; }
  #estado { font-size: .85rem; color: var(--muted); min-height: 1.5em; }

  #cam {
    position: fixed; z-index: 3;
    left: max(16px, env(safe-area-inset-left, 0px)); bottom: 16px;
    width: min(320px, 45vw);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
  }
  #cam .bar {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 6px 10px; font-size: .75rem; color: var(--muted);
    border-bottom: 1px solid var(--line);
  }
  #cam .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 6px; }
  #cam.alerta .dot { background: var(--hit); box-shadow: 0 0 8px var(--hit); }
  #cam .wrap { position: relative; aspect-ratio: 4 / 3; }
  #cam video, #cam canvas { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); object-fit: cover; }

  #fs {
    position: fixed; z-index: 3;
    right: max(16px, env(safe-area-inset-right, 0px)); bottom: 16px;
    padding: 8px 14px; font-size: .8rem;
    background: var(--panel); color: var(--fg); border-color: var(--line);
  }

  #escritorio { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .ventana {
    position: absolute;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px; overflow: hidden;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .6);
    animation: pop .18s ease-out;
    max-width: 90vw;
  }
  .ventana .tit {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 8px; font-size: .72rem; color: var(--muted);
    background: #221d31;
  }
  .ventana .tit span:last-child { color: var(--accent); }
  .ventana img { display: block; max-width: min(380px, 80vw); max-height: 60vh; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .ventana { animation: none; } }

  #fondo {
    position: fixed; inset: 0; display: grid; place-items: center; z-index: 1;
    padding: 0 max(16px, env(safe-area-inset-left, 0px));
    color: var(--muted); text-align: center; font-size: .9rem;
  }
  #fondo b { display: block; font: 400 1.6rem var(--display); color: var(--line); margin-bottom: 6px; }
</style>
</head>
<body>

<div id="intro">
  <div class="box">
    <h1>Michael Cam</h1>
    <p>Coge el móvil delante de la cámara y la pantalla se llena de <strong>Michael Jackson</strong>. Suéltalo y desaparece.</p>
    <button id="empezar">Activar cámara</button>
    <div id="estado">Funciona en Chrome o Edge. El vídeo no sale de tu ordenador.</div>
  </div>
</div>

<div id="fondo"><div><b>Vigilando…</b>Suelta el móvil y aquí no pasa nada.</div></div>
<div id="escritorio"></div>

<div id="cam" hidden>
  <div class="bar"><span><i class="dot"></i><span id="camtxt">Sin móvil</span></span><span id="fps"></span></div>
  <div class="wrap"><video id="video" playsinline muted></video><canvas id="lienzo"></canvas></div>
</div>
<button id="fs" hidden>Pantalla completa</button>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script src="media.js"></script>
<script>
const CONFIANZA = 0.45;
const FRAMES_PARA_ACTIVAR = 3;
const MS_PARA_QUITAR = 1000;
const MAX_VENTANAS = 10;
const MS_ENTRE_VENTANAS = 250;

const $ = (id) => document.getElementById(id);
const video = $("video"), lienzo = $("lienzo"), ctx = lienzo.getContext("2d");
const escritorio = $("escritorio");
const sonidos = MEDIA.sonidos.map((s) => { const a = new Audio(s); a.loop = true; a.preload = "auto"; return a; });
let modelo, seguidos = 0, ultimoVisto = 0, ultimaVentana = 0, abiertas = 0, sonando = null;

$("empezar").onclick = async () => {
  const btn = $("empezar");
  btn.disabled = true;
  try {
    $("estado").textContent = "Pidiendo permiso para la cámara…";
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
    video.srcObject = stream;
    await video.play();
    // desbloquea el audio con este clic
    for (const a of sonidos) { a.muted = true; a.play().then(() => { a.pause(); a.currentTime = 0; a.muted = false; }).catch(() => {}); }
    $("estado").textContent = "Cargando el detector (solo la primera vez tarda un poco)…";
    modelo = await cocoSsd.load({ base: "lite_mobilenet_v2" });
    $("intro").hidden = true;
    $("cam").hidden = false;
    $("fs").hidden = false;
    lienzo.width = video.videoWidth; lienzo.height = video.videoHeight;
    bucle();
  } catch (e) {
    btn.disabled = false;
    $("estado").textContent = e && e.name === "NotAllowedError"
      ? "Has bloqueado la cámara. Permítela en el candado de la barra de direcciones y vuelve a pulsar."
      : "No se pudo arrancar: " + (e && e.message ? e.message : e);
  }
};

$("fs").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen().catch(() => {});
};
document.addEventListener("fullscreenchange", () => {
  $("fs").textContent = document.fullscreenElement ? "Salir de pantalla completa" : "Pantalla completa";
});

let tPrev = performance.now();
async function bucle() {
  const preds = await modelo.detect(video, 6, CONFIANZA);
  const moviles = preds.filter((p) => p.class === "cell phone");

  ctx.clearRect(0, 0, lienzo.width, lienzo.height);
  ctx.lineWidth = 4; ctx.strokeStyle = "#3ddc84";
  for (const m of moviles) ctx.strokeRect(...m.bbox);

  const ahora = performance.now();
  if (moviles.length) { seguidos++; ultimoVisto = ahora; } else seguidos = 0;

  const activo = abiertas > 0;
  if (seguidos >= FRAMES_PARA_ACTIVAR || (activo && ahora - ultimoVisto < MS_PARA_QUITAR)) abrirVentana(ahora);
  else if (activo) cerrarTodo();

  $("cam").classList.toggle("alerta", moviles.length > 0);
  $("camtxt").textContent = moviles.length ? "¡Móvil detectado!" : "Sin móvil";
  $("fps").textContent = Math.round(1000 / (ahora - tPrev)) + " fps";
  tPrev = ahora;
  requestAnimationFrame(bucle);
}

function abrirVentana(ahora) {
  if (abiertas >= MAX_VENTANAS || ahora - ultimaVentana < MS_ENTRE_VENTANAS || !MEDIA.imagenes.length) return;
  if (abiertas === 0 && sonidos.length) {
    sonando = sonidos[Math.floor(Math.random() * sonidos.length)];
    sonando.currentTime = 0;
    sonando.play().catch(() => {});
  }
  ultimaVentana = ahora;
  abiertas++;
  const v = document.createElement("div");
  v.className = "ventana";
  v.innerHTML = '<div class="tit"><span>MJ ' + abiertas + '.jpg</span><span>hee-hee</span></div>';
  const img = new Image();
  img.src = MEDIA.imagenes[Math.floor(Math.random() * MEDIA.imagenes.length)];
  img.alt = "";
  v.appendChild(img);
  escritorio.appendChild(v);
  img.onload = () => {
    const w = v.offsetWidth, h = v.offsetHeight;
    v.style.left = Math.random() * Math.max(0, innerWidth - w) + "px";
    v.style.top = Math.random() * Math.max(0, innerHeight - h) + "px";
  };
}

function cerrarTodo() {
  escritorio.replaceChildren();
  abiertas = 0;
  if (sonando) { sonando.pause(); sonando = null; }
}
</script>
</body>
</html>
